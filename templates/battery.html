<html lang="ru">
    <head>
        <title>{{ .battery.Title }} — подборка товара для шорта</title>
        <link rel="stylesheet" href="/static/styles/index_style.css?v=neter8">
    </head>
    <header class="header-center">
        <a href="/" class="header-logo" aria-label="На главную">
            <img src="/static/img/logo.svg?v=neter" alt="НЭТЕР" class="header-logo__img">
        </a>
    </header>
    <div class="detail-wrapper">
        <a href="/" class="back-link">← Вернуться к списку товаров</a>
        <div class="detail-card">
            <div class="detail-card__media">
                <div class="detail-card__video-frame detail-card__video-frame--desc">
                    <video class="detail-card__video" controls autoplay muted loop playsinline>
                        <source src="http://localhost:9000/test/{{ .battery.Video }}" type="video/mp4">
                    </video>
                    <div class="detail-video-desc">
                        <p class="detail-video-desc__text">{{ .videoDescriptionOverlay }}</p>
                    </div>
                </div>
            </div>
            <div class="detail-card__body">
                <h1 class="detail-card__title">{{ .battery.Title }}</h1>
                <p class="detail-card__employees">Ёмкость и напряжение: {{ .battery.CapacityMah }} мА·ч, {{ .battery.VoltageV }} В</p>
                <form action="/battery-life/add" method="POST" class="add-to-cart-form">
                    <input type="hidden" name="battery_id" value="{{ .batteryID }}">
                    <input type="hidden" name="return_to" value="battery">
                    <label class="form-label">Количество: <input type="number" name="quantity" value="1" min="1" class="role-input" style="width:80px;"></label>
                    <button type="submit" class="cart-button">Добавить в подборку</button>
                </form>
            </div>
        </div>
    </div>
</html>
