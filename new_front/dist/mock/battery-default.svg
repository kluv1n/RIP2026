<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Типы аккумуляторных элементов">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8eef2"/>
      <stop offset="100%" style="stop-color:#d4dde4"/>
    </linearGradient>
    <linearGradient id="cell18650" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a6b4a"/>
      <stop offset="40%" style="stop-color:#2d8f63"/>
      <stop offset="100%" style="stop-color:#145a3e"/>
    </linearGradient>
    <linearGradient id="cellAA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="50%" style="stop-color:#e8c547"/>
      <stop offset="100%" style="stop-color:#a67c00"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- AA / Ni-MH ряд -->
  <g filter="url(#sh)" transform="translate(120 200)">
    <rect x="0" y="0" width="44" height="130" rx="6" fill="url(#cellAA)"/>
    <rect x="3" y="8" width="38" height="18" rx="3" fill="#f5e6a8" opacity="0.85"/>
    <ellipse cx="22" cy="0" rx="10" ry="5" fill="#8a7a40"/>
    <text x="22" y="118" text-anchor="middle" fill="#5c4a10" font-family="system-ui,sans-serif" font-size="11" font-weight="600">AA</text>
  </g>
  <g filter="url(#sh)" transform="translate(185 200)">
    <rect x="0" y="0" width="44" height="130" rx="6" fill="url(#cellAA)"/>
    <rect x="3" y="8" width="38" height="18" rx="3" fill="#f5e6a8" opacity="0.85"/>
    <ellipse cx="22" cy="0" rx="10" ry="5" fill="#8a7a40"/>
  </g>
  <!-- 18650 -->
  <g filter="url(#sh)" transform="translate(300 165)">
    <rect x="0" y="0" width="52" height="165" rx="8" fill="url(#cell18650)"/>
    <rect x="4" y="14" width="44" height="28" rx="4" fill="#0d3d2a" opacity="0.35"/>
    <ellipse cx="26" cy="0" rx="12" ry="6" fill="#0a2e20"/>
    <text x="26" y="155" text-anchor="middle" fill="#b8ffd9" font-family="system-ui,sans-serif" font-size="12" font-weight="700">18650</text>
  </g>
  <!-- Li-Po пакет -->
  <g filter="url(#sh)" transform="translate(420 220)">
    <rect x="0" y="0" width="200" height="110" rx="14" fill="#2a3542"/>
    <rect x="12" y="12" width="176" height="86" rx="8" fill="#3d4f63"/>
    <path d="M28 40h80M28 58h120M28 76h90" stroke="#7dd3c0" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <text x="100" y="100" text-anchor="middle" fill="#9fb4c8" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Li-Po</text>
  </g>
  <!-- LiFePO блок -->
  <g filter="url(#sh)" transform="translate(700 185)">
    <rect x="0" y="0" width="220" height="145" rx="12" fill="#34495e"/>
    <rect x="14" y="14" width="192" height="117" rx="8" fill="#2c3e50"/>
    <g fill="#1abc9c" opacity="0.35">
      <rect x="28" y="32" width="36" height="52" rx="4"/>
      <rect x="74" y="32" width="36" height="52" rx="4"/>
      <rect x="120" y="32" width="36" height="52" rx="4"/>
      <rect x="166" y="32" width="36" height="52" rx="4"/>
    </g>
    <text x="110" y="128" text-anchor="middle" fill="#bdc3c7" font-family="system-ui,sans-serif" font-size="12" font-weight="600">LiFePO₄</text>
  </g>
  <text x="600" y="560" text-anchor="middle" fill="#5a6d7a" font-family="system-ui,sans-serif" font-size="20" font-weight="600">Каталог типов аккумуляторов</text>
</svg>
