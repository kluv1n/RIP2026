$kind: collection
description: "Порядок запуска (чтобы все 16 отработали): 1) Поднять сервер
  (docker, migrate, seed, go run). 2) В Postman выполнять по шагам: [2] GET
  корзина → [3] DEL удалить заявку (очистить старый черновик; если черновика не
  было — может 404). [4] GET список услуг → [5] POST новая услуга (по желанию,
  для 6–7 хватает типов из seed). [6] POST добавить услугу → [7] POST добавить
  другую → [8] GET корзина (обязательно: скрипт подставит battery_life_id). [9]
  GET заявка → [10] PUT м-м (только current_ma и quantity; sort_order не
  передаётся) → [11] PUT заявка. [12] PUT завершить (ожидаем 403) → [13] PUT
  сформировать. [1] GET список заявок (уже есть сформированная заявка). [POST
  Вход модератора] → [14] PUT завершить сформированную → [15] POST регистрация →
  [16] GET одна услуга. Переменные: baseUrl, battery_life_id (из ответа корзины
  после шага 8)."
variables:
  baseUrl: http://localhost:8080
  battery_life_id: "1"
